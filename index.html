<!doctype html>
<html lang="en">

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;

      border-radius: 14px;
      display: grid;

      color: #fff;
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg,#6366f1,#7c3aed);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 27px;
    }
    p {
      margin: 0 0 18px;
      color: #64748b;
      line-height: 1.6;
    }
    .workspace {
      margin-bottom: 20px;
      font-weight: 700;
      color: #334155;
    }
    a {
      display: inline-block;
      background: #111827;
      color: #fff;
      text-decoration: none;
      padding: 11px 17px;
      border-radius: 9px;

      font-size: 11px;

</html>
